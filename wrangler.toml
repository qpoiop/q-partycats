name = "partycats"
main = "worker/index.js"
compatibility_date = "2024-12-01"

# The Worker handles WebSocket room routes (/api/room/:code/ws → Room DO) and
# serves the Vite build output (ASSETS) for everything else. Single-player is
# unaffected — it never hits the Worker's WS path.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Per-room authoritative connection state.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]   # SQLite-backed DO → works on the free plan
